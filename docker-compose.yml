services:
  app:
    build: .
    image: dt:local
    env_file: .env
    environment:
      DB_DRIVER: pg
      DATABASE_URL: postgres://dt:dt@db:5432/dt
      STORAGE_LOCAL_DIR: /data/storage
    ports:
      - '8080:8080'
    volumes:
      - dt-storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dt
      POSTGRES_PASSWORD: dt
      POSTGRES_DB: dt
    volumes:
      - dt-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dt -d dt']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    profiles: ['s3']
    # The upstream minio/minio and minio/mc images are no longer published on Docker Hub;
    # this image bundles both the server and the mc client.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_DEFAULT_BUCKETS: ''
      MINIO_ROOT_USER: dtminio
      MINIO_ROOT_PASSWORD: dtminio-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - dt-minio:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    profiles: ['s3']
    image: bitnamilegacy/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc=/opt/bitnami/minio-client/bin/mc
        $$mc alias set local http://minio:9000 dtminio dtminio-secret &&
        $$mc mb --ignore-existing local/dt-data
    restart: 'no'

volumes:
  dt-storage:
  dt-db:
  dt-minio:
